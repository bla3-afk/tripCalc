<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Master Pro | Fuel & Distance Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <button id="themeToggle" onclick="toggleTheme()" aria-label="Toggle Dark Mode">🌙</button>
            <h1 class="logo">Trip Master Pro</h1>
            <select id="currency" onchange="updateCurrency()">
                <option value="$">USD ($)</option>
                <option value="₹">INR (₹)</option>
                <option value="€">EUR (€)</option>
                <option value="£">GBP (£)</option>
            </select>
        </header>

        <section class="card">
            <label for="carSearch">1. Vehicle Model</label>
            <div class="search-box">
                <input type="text" id="carSearch" placeholder="e.g., Honda Civic">
                <button onclick="fetchVehicleData()">Fetch</button>
            </div>
            <p id="carInfo" class="info-text">Enter model to get estimated km/L.</p>
        </section>

        <section class="card map-card">
            <label>2. Select Route (Tap 2 Points)</label>
            <div id="map"></div>
            <p id="mapHint" class="info-text">Click Start and Destination on the map.</p>
        </section>

        <section class="card">
            <div class="row">
                <div class="input-wrap">
                    <label for="distance">Distance (km)</label>
                    <input type="number" id="distance" placeholder="0" step="0.1">
                </div>
                <div class="input-wrap">
                    <label for="time">Time (hrs)</label>
                    <input type="number" id="time" placeholder="1" step="0.1">
                </div>
            </div>
            
            <label for="price">Fuel Price (per L)</label>
            <div class="price-input">
                <span id="currSymbol">$</span>
                <input type="number" id="price" placeholder="0.00" step="0.01">
            </div>
            
            <button class="main-btn" onclick="calculateTrip()">Calculate Trip Stats</button>
        </section>

        <section id="results" class="results-box" style="display: none;">
            <div class="res-grid">
                <div class="res-card">
                    <span class="res-label">Fuel Needed</span>
                    <span class="res-val"><span id="fuelNeeded">0</span> L</span>
                </div>
                <div class="res-card highlighted">
                    <span class="res-label">Trip Cost</span>
                    <span class="res-val"><span id="resSymbol">$</span><span id="costRes">0</span></span>
                </div>
            </div>
            
            <div class="efficiency-section">
                <div class="res-row">
                    <span>Avg Speed: <strong id="speedRes">0</strong> km/h</span>
                </div>
                <div class="meter-container">
                    <div id="meterBar" class="meter-fill"></div>
                </div>
                <p id="efficiencyTip" class="info-text"></p>
            </div>
        </section>

        <section class="history-section">
            <div class="history-header">
                <h3>Recent Trips</h3>
                <button class="export-btn" onclick="exportToCSV()">Export CSV</button>
            </div>
            <div id="historyList"></div>
        </section>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
