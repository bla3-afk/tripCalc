<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Master Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <button id="themeToggle" onclick="toggleTheme()">🌙</button>
            <h1 class="logo">Trip Master</h1>
            <select id="currency" onchange="updateCurrency()">
                <option value="$">USD ($)</option>
                <option value="₹">INR (₹)</option>
                <option value="€">EUR (€)</option>
            </select>
        </header>

        <section class="card">
            <label>1. Vehicle Model</label>
            <div class="search-box">
                <input type="text" id="carSearch" placeholder="e.g. Honda Civic">
                <button onclick="fetchVehicleData()">Fetch</button>
            </div>
            <p id="carInfo" class="info-text">Fetch mileage to begin.</p>
        </section>

        <section class="card map-card">
            <div id="map"></div>
            <p id="mapHint" class="info-text">Tap 2 points to calculate distance.</p>
        </section>

        <section class="card">
            <div class="row">
                <div class="input-wrap">
                    <label>Distance (km)</label>
                    <input type="number" id="distance" placeholder="0">
                </div>
                <div class="input-wrap">
                    <label>Time (hrs)</label>
                    <input type="number" id="time" placeholder="1">
                </div>
            </div>
            <label>Fuel Price /L</label>
            <div class="price-input">
                <span id="currSymbol">$</span>
                <input type="number" id="price" placeholder="0.00">
            </div>
            <button class="main-btn" onclick="calculateTrip()">Calculate Trip</button>
        </section>

        <section id="results" class="results-box" style="display: none;">
            <div class="res-grid">
                <div class="res-card">
                    <span class="label">Fuel Needed</span>
                    <span class="val"><span id="fuelNeeded">0</span> L</span>
                </div>
                <div class="res-card highlighted">
                    <span class="label">Trip Cost</span>
                    <span class="val"><span id="resSymbol">$</span><span id="costRes">0</span></span>
                </div>
            </div>
            <div class="efficiency-zone">
                <p>Speed: <strong id="speedRes">0</strong> km/h</p>
                <div class="meter-bg"><div id="meterBar" class="meter-fill"></div></div>
                <p id="efficiencyTip" class="info-text"></p>
            </div>
        </section>

        <section class="history-section">
            <div class="history-header">
                <h3>History</h3>
                <button class="export-btn" onclick="exportToCSV()">Export CSV</button>
            </div>
            <div id="historyList"></div>
        </section>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>
</html>
